name: publish

# A version tag (v0.1.0, v0.1.1, ...) runs the tests, builds the sdist and the wheel, checks them,
# and uploads them to PyPI by trusted publishing: PyPI trusts this workflow of this repository in
# the environment `pypi`, so no token is stored anywhere. The tag must name the version
# ttsem/__init__.py declares. The actions are pinned to commits (the release in the comment): the
# upload job holds an OIDC token, and a moved tag would change what runs with it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: The tag is the package's version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' ttsem/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME, ttsem/__init__.py says $version"
            exit 1
          fi

      # the tests of the CI's cpu job, on the tagged commit itself: a tag on a commit that never
      # went through CI uploads nothing
      - name: Tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pytest -q -x

      - name: Build and check the metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      # the wheel alone, numpy its only dependency, away from the checkout: the recorded demo
      # travels inside it
      - name: The wheel runs the demo
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel/bin/python" -m ttsem demo

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ttsem/
    permissions:
      id-token: write  # the OIDC token PyPI exchanges for a short-lived upload token
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
