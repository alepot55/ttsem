name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The actions are pinned to commits (the release in the comment), as in publish.yml: a moved tag
# would change what runs here.

jobs:
  # ruff and mypy at the versions pinned here, so a new release of either does not turn CI red on
  # code that did not change. The rules and the mypy settings are in pyproject.toml.
  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.3 mypy==2.3.1 -e ".[test]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy

  # The package is numpy and nothing else: the interpreter, the layout checks, the race
  # detector and the recorded demo all run here, on every Python the classifiers name.
  cpu:
    name: no GPU, no Triton wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Tests
        run: pytest -q -x

      - name: Demo
        run: python -m ttsem demo

  # The wheel adds what only a compiler can do: recording a launch, dumping the module every
  # pass receives, and judging an answer in its sandbox. Still no GPU (the fake driver supplies a
  # target). Required like the job above: torch and Triton are pinned in the extra, so a failure
  # here is a change in this repository, not in a dependency.
  wheel:
    name: with the Triton wheel (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # The judge runs every answer under bwrap, and its tests skip where bwrap cannot create a
      # sandbox. Ubuntu 24.04 confines unprivileged user namespaces with AppArmor, which bwrap
      # needs, so that restriction is lifted on this throwaway runner.
      - name: bwrap, for the judge's sandbox
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install, with the pinned wheel
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
                      --extra-index-url https://pypi.org/simple \
                      -e ".[test,triton]"

      # fail here, with the reason, rather than let the judge's tests skip
      - name: The sandbox works
        run: |
          python -c "
          from ttsem import judge
          problem = judge.sandbox_problem()
          print(problem or 'bwrap creates a sandbox')
          raise SystemExit(problem is not None)
          "

      - name: Tests, including the ones that need a compile or the sandbox
        run: pytest -q -rs

      - name: Live demo
        run: python -m ttsem demo --live

  # The action this repository ships, used on itself: a test file written for `device="cuda"`
  # runs on this CPU runner, every launch compiled by Triton and executed by the semantics.
  action:
    name: the action on a GPU test suite (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./
        with:
          args: examples/ci -q
