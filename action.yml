name: "ttsem: Triton tests without a GPU"
description: >
  Run a pytest suite written for a GPU on a CPU runner: every Triton launch is compiled by the
  real frontend and executed by ttsem's semantics; out-of-bounds accesses and races between
  program instances fail the test with the kernel's own source line, and a read of memory nobody
  wrote shows up as NaN in the result.
branding:
  icon: check-circle
  color: blue
inputs:
  args:
    description: Arguments for pytest (paths, -k, -q, ...).
    required: false
    default: "-q"
  python-version:
    description: Python to run with.
    required: false
    default: "3.12"
  install:
    description: A shell command that installs the project under test (run before the tests).
    required: false
    default: ""
runs:
  using: composite
  steps:
    # pinned to a commit (the release in the comment): a moved tag would change what runs in
    # every repository that uses this action
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install torch (CPU), Triton and ttsem
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install --index-url https://download.pytorch.org/whl/cpu \
                    --extra-index-url https://pypi.org/simple \
                    "${{ github.action_path }}[triton]" pytest
    - name: Install the project under test
      if: ${{ inputs.install != '' }}
      shell: bash
      run: ${{ inputs.install }}
    - name: Tests, every launch under the semantics
      shell: bash
      run: python -m ttsem.sanitize pytest ${{ inputs.args }}
